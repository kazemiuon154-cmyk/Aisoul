<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI.SOUL</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#07080d">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=Share+Tech+Mono&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07080d;
    --bg-2:#0d0f18;
    --cyan:#00f0ff;
    --magenta:#ff2ea6;
    --purple:#8b3cff;
    --acid:#c6ff3c;
    --text:#dbe9ff;
    --text-dim:#7488a8;
    --line: rgba(0,240,255,0.18);
    --glass: rgba(255,255,255,0.06);
    --glass-border: rgba(255,255,255,0.16);
    --scan-opacity: 0.5;
    --grid-opacity: 0.055;
  }
  html[data-theme="light"]{
    --bg:#eef1fb;
    --bg-2:#e2e6f5;
    --cyan:#0090a6;
    --magenta:#c81c7f;
    --purple:#6a2fd1;
    --acid:#5f8f00;
    --text:#161a2c;
    --text-dim:#5a6383;
    --line: rgba(0,120,140,0.18);
    --glass: rgba(20,25,50,0.05);
    --glass-border: rgba(20,25,50,0.14);
    --scan-opacity: 0.12;
    --grid-opacity: 0.05;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Vazirmatn', sans-serif;
    display:flex; flex-direction:column;
    min-height:100svh;
    position:relative;
    overflow-x:hidden;
    transition:background 0.3s ease, color 0.3s ease;
  }
  .mono{ font-family:'Share Tech Mono', monospace; }
  ::selection{ background:var(--magenta); color:var(--bg); }
  button{ font-family:inherit; }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  /* ---------- BACKDROP ---------- */
  .grid-bg{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(0,240,255,var(--grid-opacity)) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,240,255,var(--grid-opacity)) 1px, transparent 1px);
    background-size:42px 42px;
    -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%, black 20%, transparent 75%);
            mask-image:radial-gradient(ellipse 80% 60% at 50% 0%, black 20%, transparent 75%);
  }
  .glow-a{
    position:fixed; top:-160px; right:-120px; width:480px; height:480px; z-index:0; pointer-events:none;
    background:radial-gradient(circle, rgba(255,46,166,0.22), transparent 65%);
    filter:blur(10px);
  }
  .glow-b{
    position:fixed; bottom:-200px; left:-140px; width:520px; height:520px; z-index:0; pointer-events:none;
    background:radial-gradient(circle, rgba(139,60,255,0.20), transparent 65%);
    filter:blur(10px);
  }
  .scanlines{
    position:fixed; inset:0; z-index:5; pointer-events:none; opacity:var(--scan-opacity);
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.14) 3px);
    mix-blend-mode:overlay;
  }

  /* ---------- HEADER ---------- */
  header{
    position:relative; z-index:2;
    padding:22px 20px 18px; text-align:center;
    border-bottom:1px solid var(--line);
  }
  .brand{
    display:inline-flex; align-items:center; gap:10px;
    font-family:'Orbitron', sans-serif; font-weight:800;
    font-size:1.3rem; letter-spacing:0.06em;
    color:var(--text);
    text-shadow:0 0 12px rgba(0,240,255,0.55);
  }
  .brand-ai{ color:var(--cyan); text-shadow:0 0 14px rgba(0,240,255,0.75); }
  .brand-dot{ color:var(--acid); }
  .brand-soul{
    background:linear-gradient(135deg, var(--magenta), var(--purple));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:none;
  }
  .status-line{
    margin-top:8px; font-size:0.72rem; letter-spacing:0.12em;
    color:var(--acid); display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .dot{
    width:6px; height:6px; border-radius:50%; background:var(--acid);
    box-shadow:0 0 8px var(--acid);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  .header-icon{
    position:absolute; top:20px;
    width:40px; height:40px; border-radius:50%;
    background:radial-gradient(circle at 32% 28%, rgba(255,255,255,0.5), rgba(255,255,255,0.06) 50%);
    backdrop-filter:blur(16px) saturate(200%);
    -webkit-backdrop-filter:blur(16px) saturate(200%);
    border:1.5px solid rgba(255,255,255,0.35); color:var(--text);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:
      0 10px 20px rgba(0,0,0,0.45),
      0 2px 4px rgba(0,0,0,0.3),
      inset 0 3px 2px rgba(255,255,255,0.5),
      inset 0 -6px 10px rgba(0,0,0,0.25);
    transition:transform 0.15s ease, box-shadow 0.15s ease, border-color 0.2s ease, color 0.2s ease;
  }
  .header-icon:active{ transform:translateY(1px) scale(0.92); }
  .header-icon:hover{ transform:translateY(-2px); border-color:var(--cyan); color:var(--cyan); }
  .header-icon svg{ width:18px; height:18px; }
  #historyBtn{ inset-inline-start:18px; }
  #newChatBtn{ inset-inline-end:18px; }

  /* ---------- MAIN ---------- */
  main{
    position:relative; z-index:2;
    flex:1; display:flex; justify-content:center;
    padding:20px 14px 14px; min-height:0;
  }
  .chat-shell{
    width:100%; max-width:760px;
    display:flex; flex-direction:column; min-height:0;
    border:1.5px solid rgba(255,255,255,0.14); border-radius:30px;
    background:linear-gradient(160deg, rgba(255,255,255,0.05), rgba(13,15,24,0.65));
    backdrop-filter:blur(24px) saturate(160%);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    box-shadow:0 24px 60px rgba(0,0,0,0.55), 0 0 50px rgba(0,240,255,0.07), inset 0 1px 1px rgba(255,255,255,0.15);
    overflow:hidden;
  }

  .chat-scroll{
    flex:1; overflow-y:auto;
    display:flex; flex-direction:column; gap:16px;
    padding:22px;
  }
  .chat-scroll::-webkit-scrollbar{ width:6px; }
  .chat-scroll::-webkit-scrollbar-thumb{ background:var(--purple); border-radius:3px; }

  .empty-state{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:16px; padding:40px 16px; color:var(--text-dim);
  }
  .empty-state .glyph{
    font-family:'Orbitron'; font-size:2.4rem; color:var(--cyan);
    text-shadow:0 0 18px rgba(0,240,255,0.6);
  }
  .empty-state p{ font-size:0.92rem; max-width:340px; font-weight:300; line-height:1.8; }

  .suggestions{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:6px; }
  .sugg-chip{
    border:1.5px solid rgba(255,255,255,0.3);
    background:
      linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0.03)),
      linear-gradient(160deg, rgba(0,240,255,0.14), rgba(139,60,255,0.08));
    color:var(--text); padding:11px 20px; border-radius:999px;
    font-size:0.82rem; cursor:pointer;
    box-shadow:
      0 8px 16px rgba(0,0,0,0.45),
      0 2px 4px rgba(0,0,0,0.3),
      inset 0 2px 1px rgba(255,255,255,0.4),
      inset 0 -6px 10px rgba(0,0,0,0.3);
    transition:transform 0.15s ease, box-shadow 0.15s ease, border-color 0.2s ease, color 0.2s ease;
  }
  .sugg-chip:hover{
    border-color:var(--cyan); color:var(--cyan); transform:translateY(-3px);
  }
  .sugg-chip:active{ transform:translateY(1px) scale(0.96); box-shadow:
      0 3px 8px rgba(0,0,0,0.4),
      inset 0 3px 6px rgba(0,0,0,0.35); }

  /* ---------- MESSAGES ---------- */
  .msg-row{ display:flex; flex-direction:column; gap:6px; }
  .msg-tag{ font-family:'Share Tech Mono'; font-size:0.68rem; letter-spacing:0.1em; opacity:0.55; }
  .msg-row.user .msg-tag{ color:var(--magenta); text-align:left; }
  .msg-row.bot .msg-tag{ color:var(--cyan); }

  .msg{
    max-width:84%; padding:14px 20px; font-size:0.96rem; line-height:1.8;
    border-radius:22px; white-space:pre-wrap; word-break:break-word;
    backdrop-filter:blur(16px) saturate(180%);
    -webkit-backdrop-filter:blur(16px) saturate(180%);
    box-shadow:0 8px 20px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.18);
  }
  .msg.user{
    background:linear-gradient(160deg, rgba(255,46,166,0.24), rgba(255,46,166,0.06));
    border:1.5px solid rgba(255,255,255,0.25);
    color:var(--text); margin-inline-start:auto;
    border-bottom-left-radius:6px;
  }
  .msg.bot{
    background:linear-gradient(160deg, rgba(255,255,255,0.14), rgba(0,240,255,0.05));
    border:1.5px solid rgba(255,255,255,0.18);
    color:var(--text);
    border-bottom-right-radius:6px;
  }
  .msg.typing{ opacity:0.6; font-style:italic; }
  .msg img{ max-width:100%; border-radius:14px; margin-top:8px; display:block; border:1px solid var(--line); }

  /* ---------- LIQUID GLASS COMPOSER ---------- */
  .composer{
    position:relative;
    margin:0 16px 18px;
    padding:16px;
    border-radius:32px;
    background:
      linear-gradient(135deg, rgba(255,255,255,0.22), rgba(255,255,255,0.04) 45%, rgba(0,240,255,0.10) 100%);
    backdrop-filter: blur(42px) saturate(220%) brightness(1.15);
    -webkit-backdrop-filter: blur(42px) saturate(220%) brightness(1.15);
    border:1.5px solid rgba(255,255,255,0.35);
    box-shadow:
      0 30px 60px rgba(0,0,0,0.6),
      0 10px 24px rgba(0,240,255,0.14),
      0 0 0 1px rgba(255,255,255,0.05),
      inset 0 2px 1px rgba(255,255,255,0.55),
      inset 0 -18px 28px rgba(0,0,0,0.32),
      inset 18px 0 30px -20px rgba(255,46,166,0.15),
      inset -18px 0 30px -20px rgba(139,60,255,0.18);
    transform:translateY(-10px);
    transition:border-color 0.25s ease, box-shadow 0.25s ease;
    overflow:hidden;
    isolation:isolate;
  }
  .composer::before{
    content:'';
    position:absolute; top:4px; left:12%; right:12%; height:1.5px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
    border-radius:999px; pointer-events:none; z-index:2;
  }
  .composer::after{
    content:'';
    position:absolute; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(120% 60% at 15% -10%, rgba(255,255,255,0.35), transparent 55%),
      radial-gradient(90% 50% at 100% 120%, rgba(0,240,255,0.16), transparent 60%);
    mix-blend-mode:screen;
  }
  .composer > *{ position:relative; z-index:1; }
  .composer:focus-within{
    border-color:rgba(0,240,255,0.6);
    box-shadow:
      0 30px 60px rgba(0,0,0,0.6),
      0 0 0 4px rgba(0,240,255,0.22),
      0 10px 30px rgba(0,240,255,0.22),
      inset 0 2px 1px rgba(255,255,255,0.6),
      inset 0 -18px 28px rgba(0,0,0,0.3);
  }

  .attach-preview{
    display:none; align-items:center; gap:10px; padding:0 6px 12px;
  }
  .attach-preview.show{ display:flex; }
  .attach-preview img{
    width:44px; height:44px; object-fit:cover; border-radius:14px; border:1px solid var(--cyan);
    box-shadow:0 4px 10px rgba(0,0,0,0.4);
  }
  .attach-name{ font-size:0.78rem; color:var(--text-dim); flex:1; }
  .attach-remove{
    background:radial-gradient(circle at 32% 28%, rgba(255,255,255,0.5), rgba(255,46,166,0.15) 55%);
    border:1.5px solid rgba(255,255,255,0.35); color:var(--text-dim);
    width:26px; height:26px; border-radius:50%; cursor:pointer; font-size:0.8rem;
    box-shadow:0 5px 10px rgba(0,0,0,0.4), inset 0 2px 1px rgba(255,255,255,0.5), inset 0 -3px 5px rgba(0,0,0,0.2);
    transition:transform 0.15s ease;
  }
  .attach-remove:active{ transform:scale(0.9); }
  .attach-remove:hover{ color:var(--magenta); border-color:var(--magenta); }

  .input-bar{
    display:flex; gap:10px; align-items:center;
  }
  .icon-btn{
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,0.55), rgba(255,255,255,0.08) 45%, rgba(255,255,255,0.02) 70%);
    backdrop-filter: blur(14px) saturate(200%);
    -webkit-backdrop-filter: blur(14px) saturate(200%);
    border:1.5px solid rgba(255,255,255,0.4); color:var(--text-dim);
    width:44px; height:44px; border-radius:50%; flex-shrink:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:
      0 10px 18px rgba(0,0,0,0.45),
      0 2px 4px rgba(0,0,0,0.3),
      inset 0 3px 2px rgba(255,255,255,0.6),
      inset 0 -8px 12px rgba(0,0,0,0.25);
    transition:transform 0.15s ease, box-shadow 0.15s ease, border-color 0.2s ease, color 0.2s ease;
  }
  .icon-btn:hover{ border-color:var(--cyan); color:var(--cyan); transform:translateY(-3px); box-shadow:
      0 14px 24px rgba(0,0,0,0.5),
      0 2px 4px rgba(0,0,0,0.3),
      inset 0 3px 2px rgba(255,255,255,0.7),
      inset 0 -8px 12px rgba(0,0,0,0.25); }
  .icon-btn:active{ transform:translateY(1px) scale(0.94); box-shadow:
      0 3px 8px rgba(0,0,0,0.4),
      inset 0 3px 6px rgba(0,0,0,0.35),
      inset 0 -2px 4px rgba(255,255,255,0.15); }
  .icon-btn svg{ width:18px; height:18px; }

  .input-bar textarea{
    flex:1; resize:none; border:none; background:transparent;
    font-family:'Vazirmatn'; font-size:0.95rem; color:var(--text);
    max-height:120px; line-height:1.6; padding:10px 8px;
  }
  .input-bar textarea:focus{ outline:none; }
  .input-bar textarea::placeholder{ color:var(--text-dim); }

  .send-btn{
    background:
      radial-gradient(circle at 32% 26%, rgba(255,255,255,0.85), rgba(255,255,255,0.05) 42%),
      linear-gradient(150deg, rgba(0,240,255,0.95), rgba(139,60,255,0.95) 75%);
    backdrop-filter: blur(10px);
    border:1.5px solid rgba(255,255,255,0.55); color:var(--bg);
    width:48px; height:48px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:
      0 14px 26px rgba(0,240,255,0.4),
      0 4px 8px rgba(0,0,0,0.3),
      inset 0 3px 2px rgba(255,255,255,0.75),
      inset 0 -10px 14px rgba(0,0,0,0.3);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .send-btn:hover{ transform:translateY(-3px) scale(1.05); box-shadow:
      0 18px 32px rgba(0,240,255,0.55),
      0 4px 8px rgba(0,0,0,0.3),
      inset 0 3px 2px rgba(255,255,255,0.85),
      inset 0 -10px 14px rgba(0,0,0,0.3); }
  .send-btn:active{ transform:translateY(1px) scale(0.94); box-shadow:
      0 4px 10px rgba(0,240,255,0.3),
      inset 0 4px 8px rgba(0,0,0,0.35),
      inset 0 -2px 4px rgba(255,255,255,0.2); }
  .send-btn:active{ transform:translateY(0) scale(0.95); }
  .send-btn:disabled{ opacity:0.35; cursor:default; transform:none; box-shadow:none; }
  .send-btn svg{ width:18px; height:18px; }

  .icon-btn:focus-visible, .send-btn:focus-visible, .sugg-chip:focus-visible, .header-icon:focus-visible{
    outline:2px solid var(--cyan); outline-offset:2px;
  }

  @media (max-width:480px){
    .brand{ font-size:1.05rem; }
  }

  /* ---------- HISTORY SIDEBAR ---------- */
  .sidebar-overlay{
    position:fixed; inset:0; z-index:65;
    background:rgba(0,0,0,0.55); backdrop-filter:blur(2px);
    opacity:0; pointer-events:none; transition:opacity 0.25s ease;
  }
  .sidebar-overlay.open{ opacity:1; pointer-events:auto; }

  .sidebar{
    position:fixed; top:0; inset-inline-start:0; height:100%;
    width:min(300px, 82vw); z-index:70;
    background:linear-gradient(160deg, rgba(255,255,255,0.08), rgba(10,11,18,0.75));
    backdrop-filter:blur(30px) saturate(200%);
    -webkit-backdrop-filter:blur(30px) saturate(200%);
    border-inline-end:1.5px solid rgba(255,255,255,0.18);
    display:flex; flex-direction:column; padding:20px 16px;
    transform:translateX(-100%);
    transition:transform 0.3s ease;
    box-shadow:12px 0 50px rgba(0,0,0,0.55), inset -1px 0 0 rgba(255,255,255,0.1);
  }
  html[dir="rtl"] .sidebar{ transform:translateX(100%); }
  .sidebar.open{ transform:translateX(0); }

  .sidebar-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .sidebar-title{ font-family:'Orbitron'; font-size:0.95rem; color:var(--text); letter-spacing:0.04em; }
  .sidebar-close{
    background:radial-gradient(circle at 32% 28%, rgba(255,255,255,0.5), rgba(255,255,255,0.05) 55%);
    border:1.5px solid rgba(255,255,255,0.3); color:var(--text-dim);
    width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:0.85rem;
    box-shadow:0 5px 10px rgba(0,0,0,0.4), inset 0 2px 1px rgba(255,255,255,0.5), inset 0 -3px 5px rgba(0,0,0,0.2);
    transition:transform 0.15s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .sidebar-close:active{ transform:scale(0.9); }
  .sidebar-close:hover{ color:var(--cyan); border-color:var(--cyan); }

  .new-chat-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:12px; border-radius:999px; margin-bottom:18px;
    background:
      radial-gradient(circle at 30% 20%, rgba(255,255,255,0.5), transparent 55%),
      linear-gradient(150deg, var(--cyan), var(--purple) 80%);
    color:var(--bg); font-weight:700; font-size:0.85rem;
    border:1.5px solid rgba(255,255,255,0.4); cursor:pointer;
    box-shadow:
      0 10px 20px rgba(0,240,255,0.3),
      0 2px 4px rgba(0,0,0,0.3),
      inset 0 3px 2px rgba(255,255,255,0.6),
      inset 0 -8px 12px rgba(0,0,0,0.25);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .new-chat-btn:hover{ transform:translateY(-3px); }
  .new-chat-btn:active{ transform:translateY(1px) scale(0.97); }

  .conv-list{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
  .conv-list::-webkit-scrollbar{ width:5px; }
  .conv-list::-webkit-scrollbar-thumb{ background:var(--purple); border-radius:3px; }

  .conv-item{
    display:flex; align-items:center; gap:4px; width:100%;
    background:rgba(255,255,255,0.03); border:1px solid transparent;
    border-radius:14px; transition:background 0.2s ease, border-color 0.2s ease;
  }
  .conv-item:hover{ background:rgba(0,240,255,0.07); border-color:var(--line); }
  .conv-item.active{ background:rgba(0,240,255,0.12); border-color:var(--cyan); }
  .conv-main-btn{
    flex:1; min-width:0; display:block; text-align:inherit; background:transparent; border:none;
    color:var(--text); padding:12px 6px 12px 14px; cursor:pointer; font-family:'Vazirmatn'; font-size:0.85rem;
  }
  .conv-main-btn .conv-title{
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; margin-bottom:4px;
  }
  .conv-main-btn .conv-time{ font-family:'Share Tech Mono'; font-size:0.66rem; color:var(--text-dim); }
  .conv-rename-btn{
    flex-shrink:0; width:28px; height:28px; margin-inline-end:8px; border-radius:50%;
    background:transparent; border:1px solid transparent; color:var(--text-dim); cursor:pointer;
    font-size:0.8rem; display:flex; align-items:center; justify-content:center;
    transition:color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .conv-rename-btn:hover{ color:var(--cyan); border-color:var(--line); background:rgba(0,240,255,0.08); }
  .conv-rename-input{
    flex:1; min-width:0; margin:6px; padding:8px 10px; border-radius:10px;
    background:rgba(0,0,0,0.25); border:1.5px solid var(--cyan); color:var(--text);
    font-family:'Vazirmatn'; font-size:0.85rem; outline:none;
  }
  html[data-theme="light"] .conv-rename-input{ background:rgba(255,255,255,0.7); }

  .conv-empty{ color:var(--text-dim); font-size:0.82rem; text-align:center; margin-top:30px; line-height:1.8; }

  /* ---------- SIDEBAR SEARCH ---------- */
  .conv-search-wrap{ margin-bottom:14px; }
  .conv-search{
    width:100%; padding:11px 14px; border-radius:14px;
    background:rgba(255,255,255,0.04); border:1.5px solid var(--glass-border);
    color:var(--text); font-family:'Vazirmatn'; font-size:0.82rem; outline:none;
    transition:border-color 0.2s ease;
  }
  .conv-search::placeholder{ color:var(--text-dim); }
  .conv-search:focus{ border-color:var(--cyan); }

  /* ---------- SIDEBAR SETTINGS (persona + theme) ---------- */
  .settings-block{
    border:1px solid var(--line); border-radius:16px; padding:14px;
    margin-bottom:16px; background:rgba(255,255,255,0.03);
  }
  .settings-label{
    font-family:'Share Tech Mono'; font-size:0.68rem; letter-spacing:0.08em;
    color:var(--text-dim); margin-bottom:8px;
  }
  .persona-row{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .persona-chip{
    padding:7px 12px; border-radius:999px; font-size:0.76rem; cursor:pointer;
    background:rgba(255,255,255,0.04); border:1.5px solid var(--glass-border); color:var(--text-dim);
    transition:all 0.2s ease;
  }
  .persona-chip:hover{ color:var(--text); border-color:var(--cyan); }
  .persona-chip.active{
    color:var(--bg); border-color:transparent;
    background:linear-gradient(135deg, var(--cyan), var(--purple));
    font-weight:600;
  }
  .theme-row{ display:flex; align-items:center; justify-content:space-between; }
  .theme-toggle{
    width:44px; height:26px; border-radius:999px; position:relative; cursor:pointer;
    background:rgba(255,255,255,0.08); border:1.5px solid var(--glass-border);
    transition:background 0.2s ease;
  }
  .theme-toggle::after{
    content:''; position:absolute; top:2px; inset-inline-start:2px;
    width:19px; height:19px; border-radius:50%;
    background:linear-gradient(135deg, var(--cyan), var(--purple));
    transition:inset-inline-start 0.25s ease;
  }
  html[data-theme="light"] .theme-toggle::after{ inset-inline-start:21px; }

  /* ---------- MESSAGE ACTION BAR ---------- */
  .msg-actions{
    display:flex; gap:6px; margin-top:2px;
  }
  .msg-row.user .msg-actions{ justify-content:flex-end; }
  .msg-action-btn{
    display:flex; align-items:center; justify-content:center;
    width:26px; height:26px; border-radius:50%; cursor:pointer;
    background:rgba(255,255,255,0.04); border:1px solid var(--glass-border);
    color:var(--text-dim); transition:color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .msg-action-btn:hover{ color:var(--cyan); border-color:var(--cyan); background:rgba(0,240,255,0.08); }
  .msg-action-btn svg{ width:13px; height:13px; }
  .msg-action-btn.copied{ color:var(--acid); border-color:var(--acid); }

  .typing-cursor{
    display:inline-block; width:2px; height:1em; background:var(--cyan);
    vertical-align:text-bottom; margin-inline-start:2px;
    animation:blink 0.9s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }
</style>
</head>
<body>

<div class="grid-bg" aria-hidden="true"></div>
<div class="glow-a" aria-hidden="true"></div>
<div class="glow-b" aria-hidden="true"></div>
<div class="scanlines" aria-hidden="true"></div>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-head">
    <div class="sidebar-title">تاریخچه</div>
    <button class="sidebar-close" id="sidebarClose">✕</button>
  </div>
  <button class="new-chat-btn" id="sidebarNewChat">+ گفتگوی جدید</button>

  <div class="settings-block">
    <div class="settings-label">شخصیت پاسخ‌گو</div>
    <div class="persona-row" id="personaRow">
      <button class="persona-chip" data-persona="formal">رسمی</button>
      <button class="persona-chip" data-persona="humor">شوخ</button>
      <button class="persona-chip" data-persona="tech">متخصص فنی</button>
    </div>
    <div class="theme-row">
      <span class="settings-label" style="margin-bottom:0;">حالت روشن/تاریک</span>
      <button class="theme-toggle" id="themeToggle" aria-label="تغییر حالت روشن/تاریک"></button>
    </div>
  </div>

  <div class="conv-search-wrap">
    <input type="text" id="convSearch" class="conv-search" placeholder="جستجو در تاریخچه…">
  </div>

  <div class="conv-list" id="convList">
    <div class="conv-empty" id="convEmpty">هنوز گفتگویی ثبت نشده</div>
  </div>
</aside>

<header>
  <button class="header-icon" id="historyBtn" aria-label="تاریخچه گفتگوها">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 3"/>
    </svg>
  </button>
  <div class="brand"><span class="brand-ai">AI</span><span class="brand-dot">.</span><span class="brand-soul">SOUL</span></div>
  <div class="status-line mono"><span class="dot"></span> ONLINE // AI CORE ACTIVE</div>
  <button class="header-icon" id="newChatBtn" aria-label="گفتگوی جدید">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>
    </svg>
  </button>
</header>

<main>
  <div class="chat-shell">
    <div class="chat-scroll" id="chatScroll">
      <div class="empty-state" id="emptyState">
        <div class="glyph mono">&gt;_</div>
        <p>هر سوالی داری بپرس — متن یا عکس بفرست. سیستم آماده‌ی پاسخگوییه.</p>
        <div class="suggestions">
          <button class="sugg-chip" data-q="فرق هوش مصنوعی و یادگیری ماشین چیه؟">فرق AI و یادگیری ماشین</button>
          <button class="sugg-chip" data-q="چطور یک عادت جدید رو تثبیت کنم؟">تثبیت عادت جدید</button>
          <button class="sugg-chip" data-q="این عکس رو توضیح بده">تحلیل تصویر</button>
        </div>
      </div>
    </div>

    <div class="composer">
      <div class="attach-preview" id="attachPreview">
        <img id="attachThumb" alt="پیش‌نمایش تصویر">
        <div class="attach-name" id="attachName">image.jpg</div>
        <button class="attach-remove" id="attachRemove">✕</button>
      </div>

      <div class="input-bar">
        <input type="file" id="fileInput" accept="image/*" hidden>
        <button class="icon-btn" id="attachBtn" aria-label="پیوست عکس">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="M21 15l-5-5L5 21"/>
          </svg>
        </button>
        <textarea id="chatInput" placeholder="پیامت رو بنویس…" rows="1"></textarea>
        <button class="send-btn" id="sendBtn" aria-label="ارسال">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
      </div>
    </div>
  </div>
</main>

<script>
  const chatScroll = document.getElementById('chatScroll');
  const API_ENDPOINT = "/api/chat";
  const emptyState = document.getElementById('emptyState');
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const fileInput = document.getElementById('fileInput');
  const attachBtn = document.getElementById('attachBtn');
  const attachPreview = document.getElementById('attachPreview');
  const attachThumb = document.getElementById('attachThumb');
  const attachName = document.getElementById('attachName');
  const attachRemove = document.getElementById('attachRemove');

  const sidebar = document.getElementById('sidebar');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const historyBtn = document.getElementById('historyBtn');
  const sidebarClose = document.getElementById('sidebarClose');
  const newChatBtn = document.getElementById('newChatBtn');
  const sidebarNewChat = document.getElementById('sidebarNewChat');
  const convList = document.getElementById('convList');
  const convEmpty = document.getElementById('convEmpty');
  const convSearch = document.getElementById('convSearch');
  const personaRow = document.getElementById('personaRow');
  const themeToggle = document.getElementById('themeToggle');

  const BASE_SYSTEM_PROMPT = "تو «AI.SOUL» هستی، یک دستیار پرسش‌وپاسخ عمومی با ظاهر سایبرپانک. به فارسی روان، دقیق و مختصر پاسخ بده. اگر عکسی برات فرستاده شد، محتوای اون رو تحلیل و توصیف کن.";
  const PERSONAS = {
    formal: "لحن پاسخ‌هات رسمی، مؤدبانه و حرفه‌ای باشه؛ از زبان محاوره‌ای و شوخی پرهیز کن.",
    humor: "لحن پاسخ‌هات صمیمی و با کمی شوخ‌طبعی باشه، ولی همچنان دقیق و مفید بمون.",
    tech: "مثل یک متخصص فنی دقیق و عمیق پاسخ بده؛ در صورت نیاز از اصطلاحات تخصصی، مثال و جزئیات فنی استفاده کن."
  };

  function getSystemPrompt(){
    const p = PERSONAS[selectedPersona];
    return p ? BASE_SYSTEM_PROMPT + ' ' + p : BASE_SYSTEM_PROMPT;
  }

  let history = [];
  let started = false;
  let pendingImage = null;
  let currentConvId = null;
  let lastConvIndex = [];
  let selectedPersona = 'formal';

  // ---------- storage helpers (persistent across sessions, uses browser localStorage) ----------
  const LS_PREFIX = 'aisoul:';
  async function storageGet(key){
    try{ return localStorage.getItem(LS_PREFIX + key); } catch(e){ return null; }
  }
  async function storageSet(key, value){
    try{ localStorage.setItem(LS_PREFIX + key, value); } catch(e){ /* ignore */ }
  }
  async function storageDelete(key){
    try{ localStorage.removeItem(LS_PREFIX + key); } catch(e){ /* ignore */ }
  }

  // ---------- theme (dark/light) ----------
  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
  }
  async function initTheme(){
    const saved = await storageGet('theme');
    applyTheme(saved === 'light' ? 'light' : 'dark');
  }
  themeToggle.addEventListener('click', async ()=>{
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    const next = isLight ? 'dark' : 'light';
    applyTheme(next);
    await storageSet('theme', next);
  });

  // ---------- persona ----------
  function applyPersonaUI(){
    personaRow.querySelectorAll('.persona-chip').forEach(btn=>{
      btn.classList.toggle('active', btn.dataset.persona === selectedPersona);
    });
  }
  async function initPersona(){
    const saved = await storageGet('persona');
    if(saved && PERSONAS[saved]) selectedPersona = saved;
    applyPersonaUI();
  }
  personaRow.querySelectorAll('.persona-chip').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      selectedPersona = btn.dataset.persona;
      applyPersonaUI();
      await storageSet('persona', selectedPersona);
    });
  });

  // ---------- history search ----------
  convSearch.addEventListener('input', ()=>{
    const q = convSearch.value.trim();
    const filtered = !q ? lastConvIndex : lastConvIndex.filter(c => c.title.includes(q));
    renderConvItems(filtered, !!q);
  });

  async function getConvIndex(){
    const raw = await storageGet('conversations');
    return raw ? JSON.parse(raw) : [];
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function saveCurrentConversation(){
    if(history.length === 0) return;
    if(!currentConvId) currentConvId = 'c' + Date.now();
    let idx = await getConvIndex();
    const existing = idx.find(c => c.id === currentConvId);
    const manual = !!(existing && existing.manual);
    let title;
    if(manual){
      title = existing.title;
    } else {
      const firstUserText = (history.find(m => m.role === 'user')?.content || [])
        .find(b => b.type === 'text')?.text || 'گفتگو';
      title = firstUserText.slice(0, 40);
    }
    const record = { id: currentConvId, title, apiHistory: history, updatedAt: Date.now(), manual };
    await storageSet('conv:' + currentConvId, JSON.stringify(record));

    idx = idx.filter(c => c.id !== currentConvId);
    idx.unshift({ id: currentConvId, title, updatedAt: record.updatedAt, manual });
    await storageSet('conversations', JSON.stringify(idx));
    renderConvList(idx);
  }

  function renderConvList(idx){
    idx = (idx || []).slice().sort((a,b) => b.updatedAt - a.updatedAt);
    lastConvIndex = idx;
    const q = convSearch.value.trim();
    const filtered = !q ? idx : idx.filter(c => c.title.includes(q));
    renderConvItems(filtered, !!q);
  }

  function renderConvItems(list, isFiltered){
    convList.querySelectorAll('.conv-item').forEach(el => el.remove());
    if(!list || list.length === 0){
      convEmpty.style.display = 'block';
      convEmpty.textContent = isFiltered ? 'موردی پیدا نشد' : 'هنوز گفتگویی ثبت نشده';
      return;
    }
    convEmpty.style.display = 'none';
    list.forEach(c => {
      const row = document.createElement('div');
      row.className = 'conv-item' + (c.id === currentConvId ? ' active' : '');

      const mainBtn = document.createElement('button');
      mainBtn.className = 'conv-main-btn';
      const d = new Date(c.updatedAt);
      const timeStr = d.toLocaleDateString('fa-IR') + ' ' + d.toLocaleTimeString('fa-IR', {hour:'2-digit', minute:'2-digit'});
      mainBtn.innerHTML = `<span class="conv-title">${escapeHtml(c.title)}</span><span class="conv-time mono">${timeStr}</span>`;
      mainBtn.addEventListener('click', () => loadConversation(c.id));

      const renameBtn = document.createElement('button');
      renameBtn.className = 'conv-rename-btn';
      renameBtn.title = 'تغییر نام';
      renameBtn.setAttribute('aria-label', 'تغییر نام گفتگو');
      renameBtn.textContent = '✎';
      renameBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        startRename(row, mainBtn, c);
      });

      row.appendChild(mainBtn);
      row.appendChild(renameBtn);
      convList.appendChild(row);
    });
  }

  function startRename(row, mainBtn, conv){
    const titleEl = mainBtn.querySelector('.conv-title');
    const currentTitle = conv.title;
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'conv-rename-input';
    input.value = currentTitle;
    mainBtn.style.display = 'none';
    row.insertBefore(input, mainBtn);
    input.focus();
    input.select();

    let done = false;
    const commit = async () => {
      if(done) return;
      done = true;
      const newTitle = input.value.trim() || currentTitle;
      input.remove();
      mainBtn.style.display = '';
      await renameConversation(conv.id, newTitle);
    };
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){ e.preventDefault(); input.blur(); }
      if(e.key === 'Escape'){ done = true; input.remove(); mainBtn.style.display = ''; }
    });
  }

  async function renameConversation(id, newTitle){
    let idx = await getConvIndex();
    idx = idx.map(c => c.id === id ? { ...c, title: newTitle, manual: true } : c);
    await storageSet('conversations', JSON.stringify(idx));

    const raw = await storageGet('conv:' + id);
    if(raw){
      const rec = JSON.parse(raw);
      rec.title = newTitle;
      rec.manual = true;
      await storageSet('conv:' + id, JSON.stringify(rec));
    }
    renderConvList(idx);
  }

  function renderHistoryFromArray(){
    chatScroll.innerHTML = '';
    started = false;
    if(history.length === 0){
      chatScroll.appendChild(emptyState);
      return;
    }
    history.forEach((m, i) => {
      const textBlock = m.content.find ? m.content.find(b => b.type === 'text') : null;
      const imgBlock = m.content.find ? m.content.find(b => b.type === 'image') : null;
      const text = typeof m.content === 'string' ? m.content : (textBlock ? textBlock.text : '');
      const imageSrc = imgBlock ? `data:${imgBlock.source.media_type};base64,${imgBlock.source.data}` : null;
      addMessage({ text, imageSrc, role: m.role === 'user' ? 'user' : 'bot', idx: i, animate: false });
    });
  }

  async function loadConversation(id){
    const raw = await storageGet('conv:' + id);
    if(!raw) return;
    const record = JSON.parse(raw);
    currentConvId = record.id;
    history = record.apiHistory;
    renderHistoryFromArray();
    closeSidebar();
    const idx = await getConvIndex();
    renderConvList(idx);
  }

  function newChat(){
    history = [];
    currentConvId = null;
    started = false;
    chatScroll.innerHTML = '';
    chatScroll.appendChild(emptyState);
    closeSidebar();
  }

  function openSidebar(){
    sidebar.classList.add('open');
    sidebarOverlay.classList.add('open');
    getConvIndex().then(renderConvList);
  }
  function closeSidebar(){
    sidebar.classList.remove('open');
    sidebarOverlay.classList.remove('open');
  }

  historyBtn.addEventListener('click', openSidebar);
  sidebarClose.addEventListener('click', closeSidebar);
  sidebarOverlay.addEventListener('click', closeSidebar);
  newChatBtn.addEventListener('click', newChat);
  sidebarNewChat.addEventListener('click', newChat);

  // ---------- chat input ----------
  function autoGrow(){
    chatInput.style.height = 'auto';
    chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
  }
  chatInput.addEventListener('input', autoGrow);

  attachBtn.addEventListener('click', ()=> fileInput.click());

  fileInput.addEventListener('change', ()=>{
    const file = fileInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const base64 = reader.result.split(',')[1];
      pendingImage = { base64, mediaType: file.type, name: file.name };
      attachThumb.src = reader.result;
      attachName.textContent = file.name;
      attachPreview.classList.add('show');
    };
    reader.readAsDataURL(file);
  });

  attachRemove.addEventListener('click', ()=>{
    pendingImage = null;
    fileInput.value = '';
    attachPreview.classList.remove('show');
  });

  const ACTION_ICONS = {
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>',
    delete: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>',
    regenerate: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>'
  };

  function makeActionBtn(type, label, handler){
    const btn = document.createElement('button');
    btn.className = 'msg-action-btn';
    btn.title = label;
    btn.setAttribute('aria-label', label);
    btn.innerHTML = ACTION_ICONS[type];
    btn.addEventListener('click', handler);
    return btn;
  }

  function buildActions(row, role, idx, text){
    const old = row.querySelector('.msg-actions');
    if(old) old.remove();
    const bar = document.createElement('div');
    bar.className = 'msg-actions';
    if(role === 'bot'){
      bar.appendChild(makeActionBtn('copy', 'کپی پاسخ', () => copyMessageText(text, bar)));
      bar.appendChild(makeActionBtn('regenerate', 'گرفتن جواب جدید', () => regenerateMessage(idx)));
    } else {
      bar.appendChild(makeActionBtn('edit', 'ویرایش پیام', () => editMessage(idx)));
    }
    bar.appendChild(makeActionBtn('delete', 'حذف پیام', () => deleteMessage(idx)));
    row.appendChild(bar);
  }

  async function copyMessageText(text, bar){
    try{
      await navigator.clipboard.writeText(text);
    }catch(e){
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand('copy'); }catch(e2){ /* ignore */ }
      ta.remove();
    }
    const btn = bar.querySelector('.msg-action-btn');
    if(btn){
      btn.classList.add('copied');
      setTimeout(() => btn.classList.remove('copied'), 1200);
    }
  }

  function typeText(el, text, onDone){
    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduceMotion){
      el.textContent = text;
      if(onDone) onDone();
      return;
    }
    const cursor = document.createElement('span');
    cursor.className = 'typing-cursor';
    el.after(cursor);
    let i = 0;
    const step = Math.max(1, Math.round(text.length / 200));
    const timer = setInterval(() => {
      i += step;
      el.textContent = text.slice(0, i);
      chatScroll.scrollTop = chatScroll.scrollHeight;
      if(i >= text.length){
        clearInterval(timer);
        el.textContent = text;
        cursor.remove();
        if(onDone) onDone();
      }
    }, 14);
  }

  function addMessage({ text, imageSrc, role, idx, animate }){
    if(!started){
      if(emptyState.parentElement) emptyState.remove();
      started = true;
    }
    const row = document.createElement('div');
    row.className = 'msg-row ' + role;
    if(idx !== undefined) row.dataset.idx = idx;

    const tag = document.createElement('div');
    tag.className = 'msg-tag mono';
    tag.textContent = role === 'user' ? 'YOU >' : '< SYSTEM';
    row.appendChild(tag);

    const bubble = document.createElement('div');
    bubble.className = 'msg ' + role;
    const textSpan = document.createElement('span');
    textSpan.className = 'msg-text';
    bubble.appendChild(textSpan);
    if(imageSrc){
      const img = document.createElement('img');
      img.src = imageSrc;
      bubble.appendChild(img);
    }
    row.appendChild(bubble);
    chatScroll.appendChild(row);
    chatScroll.scrollTop = chatScroll.scrollHeight;

    const finish = () => { if(idx !== undefined) buildActions(row, role, idx, text || ''); };

    if(animate && text){
      typeText(textSpan, text, finish);
    } else {
      textSpan.textContent = text || '';
      finish();
    }
    return bubble;
  }

  async function editMessage(idx){
    const entry = history[idx];
    if(!entry || entry.role !== 'user') return;
    const textBlock = entry.content.find ? entry.content.find(b => b.type === 'text') : null;
    const text = textBlock ? textBlock.text : '';
    history = history.slice(0, idx);
    renderHistoryFromArray();
    chatInput.value = text;
    autoGrow();
    chatInput.focus();
    await saveCurrentConversation();
  }

  async function deleteMessage(idx){
    if(idx < 0 || idx >= history.length) return;
    history.splice(idx, 1);
    renderHistoryFromArray();
    if(history.length === 0 && currentConvId){
      await storageDelete('conv:' + currentConvId);
      let idxList = await getConvIndex();
      idxList = idxList.filter(c => c.id !== currentConvId);
      await storageSet('conversations', JSON.stringify(idxList));
      renderConvList(idxList);
      currentConvId = null;
      return;
    }
    await saveCurrentConversation();
  }

  async function regenerateMessage(idx){
    const entry = history[idx];
    if(!entry || entry.role !== 'assistant') return;
    history = history.slice(0, idx);
    renderHistoryFromArray();
    await requestAssistantReply();
  }

  async function requestAssistantReply(){
    sendBtn.disabled = true;
    const typingBubble = addMessage({ text: 'در حال پردازش…', role: 'bot' });
    typingBubble.classList.add('typing');

    try{
      const response = await fetch(API_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          system: getSystemPrompt(),
          messages: history
        })
      });
      const data = await response.json();
      const reply = (data.content || [])
        .map(block => block.type === 'text' ? block.text : '')
        .filter(Boolean)
        .join('\n') || 'ببخشید، پاسخی دریافت نشد. دوباره امتحان کن.';

      typingBubble.parentElement.remove();
      history.push({ role: 'assistant', content: reply });
      addMessage({ text: reply, role: 'bot', idx: history.length - 1, animate: true });
      await saveCurrentConversation();
    } catch(err){
      typingBubble.parentElement.remove();
      addMessage({ text: 'مشکلی در ارتباط پیش اومد. لطفاً دوباره امتحان کن.', role: 'bot' });
    } finally {
      sendBtn.disabled = false;
    }
  }

  async function sendMessage(customText){
    const text = (customText !== undefined ? customText : chatInput.value).trim();
    if(!text && !pendingImage) return;

    const imgSrc = pendingImage ? `data:${pendingImage.mediaType};base64,${pendingImage.base64}` : null;
    const contentBlocks = [];
    if(pendingImage){
      contentBlocks.push({
        type: 'image',
        source: { type: 'base64', media_type: pendingImage.mediaType, data: pendingImage.base64 }
      });
    }
    contentBlocks.push({ type: 'text', text: text || 'این عکس رو توضیح بده.' });
    history.push({ role: 'user', content: contentBlocks });
    addMessage({ text, imageSrc: imgSrc, role: 'user', idx: history.length - 1 });

    chatInput.value = '';
    autoGrow();
    pendingImage = null;
    fileInput.value = '';
    attachPreview.classList.remove('show');

    await requestAssistantReply();
  }

  sendBtn.addEventListener('click', ()=> sendMessage());
  chatInput.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });

  document.querySelectorAll('.sugg-chip').forEach(btn=>{
    btn.addEventListener('click', ()=> sendMessage(btn.dataset.q));
  });

  // load sidebar index and preferences on start
  initTheme();
  initPersona();
  getConvIndex().then(renderConvList);
</script>

</body>
</html>
